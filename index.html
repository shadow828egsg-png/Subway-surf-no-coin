
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Urban Runner 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#78c9ed;font-family:Arial;touch-action:none}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:14px;left:0;width:100%;display:flex;justify-content:space-around;color:white;font-size:19px;font-weight:bold;text-shadow:2px 2px 4px #111;pointer-events:none}
#message{position:fixed;inset:0;background:#071323bb;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px}
#message h1{font-size:34px;color:#ffda38;text-shadow:3px 3px #a13b13}
#message p{line-height:1.7}
button{border:0;border-radius:14px;padding:15px 35px;background:#ffcf32;color:#222;font-size:21px;font-weight:bold}
#hint{position:fixed;bottom:13px;width:100%;text-align:center;color:white;text-shadow:2px 2px 4px black;font-weight:bold;pointer-events:none;font-size:13px}
</style>
</head>
<body>
<div id="hud">
 <span>⏱️ <span id="time">0.0</span>s</span>
 <span>🪙 <span id="coins">0</span></span>
 <span>🏆 <span id="record">0</span>s</span>
</div>
<div id="message">
 <h1>URBAN RUNNER 3D</h1>
 <p>
  ⬅️ ➡️ Trocar de pista<br>
  ⬆️ Pular obstáculos<br>
  ⬇️ Deslizar por baixo<br><br>
  Pegue moedas para congelar o cronômetro!
 </p>
 <button id="start">JOGAR</button>
</div>
<div id="hint">DESLIZE NA TELA PARA CONTROLAR</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x77c9ef);
scene.fog=new THREE.Fog(0x77c9ef,35,115);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);
camera.position.set(0,5,9);
camera.lookAt(0,1,-8);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526477,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-7,13,8);
sun.castShadow=true;
scene.add(sun);

const material=(color,roughness=.75,metalness=0)=>
 new THREE.MeshStandardMaterial({color,roughness,metalness});

const colors={
 asphalt:material(0x444b54),
 rail:material(0x9da5aa,.35,.7),
 sleeper:material(0x654b38),
 blue:material(0x087fca),
 blue2:material(0x07518e),
 skin:material(0xd99a6b),
 hair:material(0x30251e),
 pants:material(0x253c69),
 shoe:material(0xeeeeee),
 gold:material(0xffc928,.25,.65),
 red:material(0xe83d32),
 orange:material(0xff7519),
 white:material(0xffffff),
 dark:material(0x263747),
 glass:material(0x9de7f2,.2,.2)
};

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(24,220),colors.asphalt
);
floor.rotation.x=-Math.PI/2;
floor.position.set(0,-.13,-95);
floor.receiveShadow=true;
scene.add(floor);

const lanes=[-2.2,0,2.2];

// Trilhos e dormentes
for(let lane=-1;lane<=1;lane++){
 const x=lane*2.2;
 for(const side of [-.48,.48]){
  const rail=new THREE.Mesh(
   new THREE.BoxGeometry(.13,.13,220),colors.rail
  );
  rail.position.set(x+side,-.03,-95);
  scene.add(rail);
 }
 for(let z=-200;z<15;z+=2.7){
  const sleeper=new THREE.Mesh(
   new THREE.BoxGeometry(1.35,.13,.35),colors.sleeper
  );
  sleeper.position.set(x,-.08,z);
  scene.add(sleeper);
 }
}

// Cenário urbano
for(let i=0;i<38;i++){
 for(const side of [-1,1]){
  const h=6+Math.random()*13;
  const palette=[0x9b806d,0x73899b,0xc2a17b,0x71836e,0x927a9b];
  const building=new THREE.Mesh(
   new THREE.BoxGeometry(5,h,5),
   material(palette[i%palette.length])
  );
  building.position.set(side*(8.5+Math.random()*2),h/2,-i*5.3-5);
  scene.add(building);

  for(let y=1.2;y<h-1;y+=2.2){
   for(let w=-1;w<=1;w++){
    const window=new THREE.Mesh(
     new THREE.BoxGeometry(.08,.85,.85),
     material(0xffdf91)
    );
    window.position.set(
     building.position.x-side*2.53,
     y,
     building.position.z+w*1.25
    );
    scene.add(window);
   }
  }
 }
}

// Placas decorativas
for(let i=0;i<9;i++){
 const z=-i*20-15;
 const post=new THREE.Mesh(
  new THREE.BoxGeometry(.13,3,.13),colors.dark
 );
 post.position.set(-5,1.5,z);
 scene.add(post);
 const sign=new THREE.Mesh(
  new THREE.BoxGeometry(1.5,.75,.15),material(0x16a36b)
 );
 sign.position.set(-5,2.8,z);
 scene.add(sign);
}

// Personagem
const player=new THREE.Group();
scene.add(player);
player.position.set(0,0,0);

function addPart(parent,geometry,mat,x,y,z){
 const mesh=new THREE.Mesh(geometry,mat);
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

const torso=addPart(player,new THREE.BoxGeometry(.66,.85,.4),colors.blue,0,1.2,0);
const shirtStripe=addPart(player,new THREE.BoxGeometry(.68,.12,.42),colors.white,0,1.35,0);
const head=addPart(player,new THREE.SphereGeometry(.34,20,16),colors.skin,0,1.88,0);
const hair=addPart(player,new THREE.SphereGeometry(.35,16,12),colors.hair,0,2.08,0);
hair.scale.set(1,.55,1);

const legs=[];
const arms=[];
for(const x of [-.2,.2]){
 const leg=addPart(player,new THREE.BoxGeometry(.23,.65,.25),colors.pants,x,.48,0);
 const shoe=addPart(player,new THREE.BoxGeometry(.28,.16,.4),colors.shoe,x,.14,-.08);
 legs.push(leg);
}
for(const x of [-.43,.43]){
 const arm=addPart(player,new THREE.BoxGeometry(.2,.65,.22),colors.skin,x,1.2,0);
 arms.push(arm);
}

// Trem com detalhes e rampa
function createTrain(){
 const g=new THREE.Group();

 addPart(g,new THREE.BoxGeometry(1.95,2.8,9),material(0x087ca9),0,1.4,0);
 addPart(g,new THREE.BoxGeometry(1.98,.18,9),material(0xe8e8e8),0,2.85,0);
 addPart(g,new THREE.BoxGeometry(2,.22,9),material(0xf2c52c),0,.35,0);

 for(let i=0;i<4;i++){
  addPart(g,new THREE.BoxGeometry(.06,.9,1.3),colors.glass,0,1.9,-3+i*2);
  addPart(g,new THREE.BoxGeometry(2,.08,.08),colors.white,0,1.35,-3+i*2);
 }

 // Rodas
 for(const z of [-3,-1,1,3]){
  for(const x of [-.95,.95]){
   const wheel=addPart(g,new THREE.CylinderGeometry(.25,.25,.15,12),colors.dark,x,.25,z);
   wheel.rotation.z=Math.PI/2;
  }
 }

 // Rampa de acesso decorativa na frente
 const ramp=addPart(g,new THREE.BoxGeometry(1.8,.22,2.5),material(0x777e83),0,.55,5.45);
 ramp.rotation.x=-.28;
 for(let i=0;i<4;i++){
  const stripe=addPart(g,new THREE.BoxGeometry(1.7,.05,.12),colors.white,0,.62+i*.08,6.25-i*.55);
  stripe.rotation.x=-.28;
 }
 return g;
}

// Obstáculos
const objects=[];

function addObstacle(type,lane,z){
 const g=new THREE.Group();

 if(type==='barrier'){
  addPart(g,new THREE.BoxGeometry(1.7,.95,.55),colors.red,0,.48,0);
  for(let i=-1;i<=1;i++){
   const stripe=addPart(g,new THREE.BoxGeometry(.35,.98,.58),colors.white,i*.48,.48,0);
   stripe.rotation.z=.35;
  }
  addPart(g,new THREE.BoxGeometry(1.85,.12,.65),colors.gold,0,1,0);
 }

 if(type==='cone'){
  addPart(g,new THREE.ConeGeometry(.43,1.25,8),colors.orange,0,.68,0);
  addPart(g,new THREE.CylinderGeometry(.48,.48,.13,8),colors.white,0,.08,0);
  addPart(g,new THREE.TorusGeometry(.25,.045,8,16),colors.white,0,.55,0);
 }

 if(type==='sign'){
  addPart(g,new THREE.BoxGeometry(1.9,.25,.3),colors.gold,0,1.65,0);
  addPart(g,new THREE.BoxGeometry(.13,1.6,.13),colors.dark,0,.8,0);
  addPart(g,new THREE.BoxGeometry(1.9,.08,.34),colors.white,0,1.65,0);
 }

 if(type==='train'){
  const train=createTrain();
  g.add(train);
 }

 g.position.set(lanes[lane],0,z);
 scene.add(g);
 objects.push({group:g,type,lane,hit:false});
}

function addCoin(lane,z){
 const g=new THREE.Group();
 const coin=new THREE.Mesh(
  new THREE.TorusGeometry(.34,.12,12,24),colors.gold
 );
 coin.rotation.y=Math.PI/2;
 g.add(coin);

 const center=new THREE.Mesh(
  new THREE.CircleGeometry(.2,20),
  material(0xffe77b,.3)
 );
 center.position.z=.04;
 g.add(center);

 g.position.set(lanes[lane],1.4,z);
 scene.add(g);
 objects.push({group:g,type:'coin',lane,hit:false});
}

// Sequências de moedas em arco
function coinLine(lane,z){
 for(let i=0;i<6;i++){
  const height=1.4+Math.sin(i/5*Math.PI)*1.15;
  const coin=new THREE.Group();
  const ring=new THREE.Mesh(
   new THREE.TorusGeometry(.34,.12,12,24),colors.gold
  );
  ring.rotation.y=Math.PI/2;
  coin.add(ring);
  coin.position.set(lanes[lane],height,z-i*1.8);
  scene.add(coin);
  objects.push({group:coin,type:'coin',lane,hit:false});
 }
}

function spawn(){
 const lane=Math.floor(Math.random()*3);
 const r=Math.random();

 if(r<.25)coinLine(lane,-75);
 else if(r<.46)addObstacle('barrier',lane,-75);
 else if(r<.64)addObstacle('cone',lane,-75);
 else if(r<.82)addObstacle('sign',lane,-75);
 else addObstacle('train',lane,-85);
}

// Estado do jogo
let running=false;
let elapsed=0;
let coinCount=0;
let record=0;
let speed=17;
let lane=1;
let jumpTime=0;
let duck=0;
let spawnTimer=0;
let last=0;

const timeEl=document.getElementById('time');
const coinEl=document.getElementById('coins');
const recordEl=document.getElementById('record');
const message=document.getElementById('message');

function updateHUD(){
 timeEl.textContent=elapsed.toFixed(1);
 coinEl.textContent=coinCount;
 recordEl.textContent=record.toFixed(1);
}

function clearObjects(){
 for(const o of objects)scene.remove(o.group);
 objects.length=0;
}

function startGame(){
 clearObjects();
 elapsed=0;
 coinCount=0;
 speed=17;
 lane=1;
 jumpTime=0;
 duck=0;
 player.position.set(0,0,0);
 player.scale.set(1,1,1);
 spawnTimer=0;
 running=true;
 message.style.display='none';
 updateHUD();
}

function endGame(){
 running=false;
 record=Math.max(record,elapsed);
 updateHUD();
 message.innerHTML=
 '<h1>FIM DE JOGO!</h1><p>Tempo: '+elapsed.toFixed(1)+
 ' segundos<br>Moedas: '+coinCount+
 '</p><button id="restart">JOGAR DE NOVO</button>';
 message.style.display='flex';
 document.getElementById('restart').onclick=startGame;
}

document.getElementById('start').onclick=startGame;

// Controles por deslize
let startX=0,startY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
 startX=e.clientX;
 startY=e.clientY;
});

renderer.domElement.addEventListener('pointerup',e=>{
 if(!running)return;

 const dx=e.clientX-startX;
 const dy=e.clientY-startY;

 if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;

 if(Math.abs(dx)>Math.abs(dy)){
  if(dx>0)lane=Math.min(2,lane+1);
  else lane=Math.max(0,lane-1);
 }else{
  if(dy<0 && jumpTime===0 && duck<=0)jumpTime=.001;
  if(dy>0 && jumpTime===0)duck=.7;
 }
});

addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')lane=Math.max(0,lane-1);
 if(e.key==='ArrowRight')lane=Math.min(2,lane+1);
 if((e.key==='ArrowUp'||e.code==='Space')&&jumpTime===0&&duck<=0)jumpTime=.001;
 if(e.key==='ArrowDown'&&jumpTime===0)duck=.7;
});

// Loop principal
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);
 last=now;

 if(running){
  // Congela o cronômetro quando pega a primeira moeda
  if(coinCount===0)elapsed+=dt;

  speed=Math.min(26,speed+dt*.12);
  spawnTimer+=dt;

  if(spawnTimer>1.35){
   spawn();
   spawnTimer=0;
  }

  // Movimento lateral
  player.position.x=THREE.MathUtils.lerp(
   player.position.x,lanes[lane],dt*11
  );

  // Pulo
  if(jumpTime>0){
   jumpTime+=dt;
   player.position.y=Math.sin(Math.min(jumpTime/.85,1)*Math.PI)*2.65;
   if(jumpTime>=.85){
    jumpTime=0;
    player.position.y=0;
   }
  }

  // Deslizar
  if(duck>0){
   duck-=dt;
   player.scale.y=.55;
  }else{
   player.scale.y=1;
  }

  // Animação de corrida
  legs.forEach((leg,i)=>{
   leg.rotation.x=Math.sin(now*.014+i*Math.PI)*.75;
  });
  arms.forEach((arm,i)=>{
   arm.rotation.x=Math.sin(now*.014+i*Math.PI)*.7;
  });

  // Objetos vindo em direção ao jogador
  for(let i=objects.length-1;i>=0;i--){
   const o=objects[i];
   o.group.position.z+=speed*dt;

   if(o.type==='coin'){
    o.group.rotation.y+=dt*2;

    if(!o.hit &&
       Math.abs(o.group.position.z)<1.15 &&
       Math.abs(player.position.x-o.group.position.x)<.9 &&
       Math.abs(player.position.y-1.4)<1.55){

     o.hit=true;
     coinCount++;
     scene.remove(o.group);
     objects.splice(i,1);
     continue;
    }
   }else if(!o.hit &&
       Math.abs(o.group.position.z)<1.2 &&
       Math.abs(player.position.x-o.group.position.x)<1.05){

    let avoided=false;

    if(o.type==='barrier'||o.type==='cone')
     avoided=player.position.y>1.15;

    if(o.type==='sign')
     avoided=duck>0;

    // Pular por cima do trem
    if(o.type==='train')
     avoided=player.position.y>2.35;

    if(!avoided){
     o.hit=true;
     endGame();
     break;
    }
   }

   if(o.group.position.z>12){
    scene.remove(o.group);
    objects.splice(i,1);
   }
  }

  // Câmera acompanha suavemente
  camera.position.x=THREE.MathUtils.lerp(
   camera.position.x,player.position.x*.25,dt*3
  );
  camera.lookAt(player.position.x*.12,1,-8);

  updateHUD();
 }

 renderer.render(scene,camera);
}

requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
