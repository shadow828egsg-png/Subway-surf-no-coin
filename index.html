
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subway Surfers No Coin</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101828;font-family:Arial;color:white}
#hud{position:absolute;top:15px;left:0;width:100%;text-align:center;z-index:2;pointer-events:none}
#timer{font-size:36px;font-weight:bold;color:#ffe45c}
#status{font-size:16px;margin-top:5px}
#message{position:absolute;top:40%;width:100%;text-align:center;z-index:3;font-size:22px;font-weight:bold}
#controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-around;z-index:4}
button{background:#ffffffcc;border:0;border-radius:15px;padding:18px 25px;font-size:23px;font-weight:bold;color:#17243a}
#restart{font-size:16px;padding:12px 20px;margin-top:12px}
</style>
</head>
<body>
<div id="hud">
  <div>🏃 NO COIN</div>
  <div id="timer">0.00 s</div>
  <div id="status">Moedas: 0 | Recorde: 0.00 s</div>
</div>
<div id="message">Toque para começar!</div>
<div id="controls">
  <button onclick="move(-1)">⬅️</button>
  <button onclick="jump()">⬆️</button>
  <button onclick="move(1)">➡️</button>
  <button onclick="duck()">⬇️</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 25, 100);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 150);
camera.position.set(0,5,10);
camera.lookAt(0,1,-8);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x555566,2));
const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(5,10,5);
scene.add(sun);

function box(w,h,d,color,x,y,z){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );
 m.position.set(x,y,z);
 scene.add(m);
 return m;
}

// Trilhos e chão
box(12,0.3,120,0x555555,0,-0.3,-40);
for(let x of [-2,0,2]){
 box(0.12,0.12,120,0xcccccc,x,0,-40);
}

// Ambiente
for(let z=-10;z>-100;z-=12){
 box(3,8,3,0x888888,-8,4,z);
 box(3,10,3,0x777799,8,5,z-5);
}

// Personagem
const player = new THREE.Group();
const body= new THREE.Mesh(
 new THREE.CapsuleGeometry(0.42,0.75,4,8),
 new THREE.MeshStandardMaterial({color:0xff3333})
);
body.position.y=1;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(0.32,16,16),
 new THREE.MeshStandardMaterial({color:0xffcc99})
);
head.position.y=1.8;
player.add(head);
scene.add(player);
player.position.z=3;

let lane=1;
const lanes=[-2,0,2];
let started=false, ended=false;
let startTime=0, record=0, coins=0;
let objects=[];
let spawnTimer=0;
let speed=15;

const timer=document.getElementById('timer');
const status=document.getElementById('status');
const message=document.getElementById('message');

function move(dir){
 if(!started||ended)return;
 lane=Math.max(0,Math.min(2,lane+dir));
}
function jump(){
 if(!started||ended)return;
 if(player.position.y<0.1){
  player.userData.vy=8;
 }
}
function duck(){
 if(!started||ended)return;
 player.scale.y=0.55;
 setTimeout(()=>player.scale.y=1,600);
}

window.move=move;
window.jump=jump;
window.duck=duck;

function start(){
 if(started)return;
 started=true;
 startTime=performance.now();
 message.style.display='none';
}

function finish(reason){
 ended=true;
 const t=(performance.now()-startTime)/1000;
 record=Math.max(record,t);
 message.innerHTML=reason+'<br>Tempo: '+t.toFixed(2)+' segundos<br><button id="restart">JOGAR NOVAMENTE</button>';
 message.style.display='block';
 document.getElementById('restart').onclick=reset;
}

function reset(){
 objects.forEach(o=>scene.remove(o.mesh));
 objects=[];
 player.position.set(0,0,3);
 lane=1;
 coins=0;
 spawnTimer=0;
 started=false;
 ended=false;
 speed=15;
 timer.textContent='0.00 s';
 status.textContent='Moedas: 0 | Recorde: '+record.toFixed(2)+' s';
 message.innerHTML='Toque para começar!';
 message.style.display='block';
}

function spawn(){
 const laneIndex=Math.floor(Math.random()*3);
 const isCoin=Math.random()<0.65;
 const mesh=isCoin?
  new THREE.Mesh(new THREE.TorusGeometry(0.4,0.12,8,20),
  new THREE.MeshStandardMaterial({color:0xffd700,metalness:0.6,roughness:0.25})):
  new THREE.Mesh(new THREE.BoxGeometry(1.3,1.5,1),
  new THREE.MeshStandardMaterial({color:0x2255cc}));

 mesh.position.set(lanes[laneIndex],isCoin?1:0.75,-65);
 scene.add(mesh);
 objects.push({mesh,isCoin,passed:false});
}

let previous=performance.now();

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-previous)/1000,0.05);
 previous=now;

 if(started&&!ended){
  const elapsed=(now-startTime)/1000;
  timer.textContent=elapsed.toFixed(2)+' s';
  status.textContent='Moedas: '+coins+' | Recorde: '+record.toFixed(2)+' s';

  player.position.x+=(lanes[lane]-player.position.x)*Math.min(1,dt*12);
  player.position.y+= (player.userData.vy||0)*dt;
  player.userData.vy=(player.userData.vy||0)-22*dt;
  if(player.position.y<0){
   player.position.y=0;
   player.userData.vy=0;
  }

  spawnTimer+=dt;
  if(spawnTimer>1.15){
   spawn();
   spawnTimer=0;
  }

  for(let i=objects.length-1;i>=0;i--){
   const o=objects[i];
   o.mesh.position.z+=speed*dt;
   if(o.isCoin)o.mesh.rotation.y+=dt*4;

   const dx=Math.abs(o.mesh.position.x-player.position.x);
   const dz=Math.abs(o.mesh.position.z-player.position.z);

   if(dx<0.8&&dz<0.9&&Math.abs(player.position.y-o.mesh.position.y)<1.2){
    if(o.isCoin){
     coins++;
     finish('🪙 VOCÊ PEGOU UMA MOEDA!');
    }else{
     finish('🚆 FIM DE JOGO!');
    }
   }

   if(o.mesh.position.z>8){
    scene.remove(o.mesh);
    objects.splice(i,1);
   }
  }
 }

 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

window.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')move(-1);
 if(e.key==='ArrowRight')move(1);
 if(e.key==='ArrowUp')jump();
 if(e.key==='ArrowDown')duck();
 if(!started&&!ended)start();
});

window.addEventListener('pointerdown',()=>{
 if(!started&&!ended)start();
},{once:false});

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
