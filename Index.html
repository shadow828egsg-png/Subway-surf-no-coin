
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subway No Coin 3D</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;
 background:#87ceeb;
 font-family:Arial;
 touch-action:none;
 user-select:none;
}
canvas{display:block;touch-action:none}
#hud{
 position:absolute;top:15px;width:100%;
 text-align:center;color:white;
 text-shadow:2px 2px 4px black;
 pointer-events:none;
}
#timer{font-size:38px;font-weight:bold;color:#ffe45c}
#status{font-size:14px;margin-top:5px}
#message{
 position:absolute;top:42%;width:100%;
 text-align:center;color:white;
 font-size:24px;font-weight:bold;
 text-shadow:2px 2px 5px black;
 pointer-events:none;
}
#message button{
 pointer-events:auto;
 padding:14px 25px;border:0;
 border-radius:12px;font-weight:bold;
 font-size:17px;
}
#help{
 position:absolute;bottom:18px;width:100%;
 text-align:center;color:white;
 font-size:13px;text-shadow:1px 1px 3px black;
 pointer-events:none;
}
</style>
</head>
<body>

<div id="hud">
 <div>🏃 NO COIN</div>
 <div id="timer">0.00 s</div>
 <div id="status">Recorde: 0.00 s</div>
</div>

<div id="message">TOQUE PARA COMEÇAR!</div>
<div id="help">Deslize para os lados, para cima ou para baixo</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,30,100);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,0.1,150
);
camera.position.set(0,5,10);
camera.lookAt(0,1,-8);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x555566,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(5,10,5);
scene.add(sun);

function box(w,h,d,color,x,y,z){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );
 mesh.position.set(x,y,z);
 scene.add(mesh);
 return mesh;
}

// Chão e trilhos
box(12,.3,120,0x555555,0,-.3,-40);

for(const x of [-2,0,2]){
 box(.12,.12,120,0xcccccc,x,0,-40);
}

// Cenário
for(let z=-10;z>-110;z-=12){
 box(3,8,3,0x888888,-8,4,z);
 box(3,10,3,0x777799,8,5,z-5);
}

// Personagem
const player=new THREE.Group();

const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(.42,.75,4,8),
 new THREE.MeshStandardMaterial({color:0xff3333})
);
body.position.y=1;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.32,16,16),
 new THREE.MeshStandardMaterial({color:0xffcc99})
);
head.position.y=1.8;
player.add(head);

scene.add(player);
player.position.z=3;

const lanes=[-2,0,2];
let lane=1;

let started=false;
let ended=false;
let startTime=0;
let record=0;
let coins=0;
let objects=[];
let spawnTimer=0;
let speed=15;

let jumping=false;
let ducking=false;
let jumpVelocity=0;
let duckUntil=0;

const timer=document.getElementById('timer');
const status=document.getElementById('status');
const message=document.getElementById('message');

function move(dir){
 if(!started||ended)return;
 lane=Math.max(0,Math.min(2,lane+dir));
}

function jump(){
 if(!started||ended||jumping)return;
 jumping=true;
 jumpVelocity=9;
}

function duck(){
 if(!started||ended)return;
 ducking=true;
 duckUntil=performance.now()+650;
 player.scale.y=.55;
}

function start(){
 if(started||ended)return;
 started=true;
 startTime=performance.now();
 message.style.display='none';
}

function finish(reason){
 if(ended)return;
 ended=true;

 const elapsed=(performance.now()-startTime)/1000;
 record=Math.max(record,elapsed);

 timer.textContent=elapsed.toFixed(2)+' s';
 status.textContent='Recorde: '+record.toFixed(2)+' s';

 message.innerHTML=
 reason+'<br>Tempo: '+elapsed.toFixed(2)+
 ' segundos<br><br><button id="restart">JOGAR NOVAMENTE</button>';

 message.style.display='block';

 document.getElementById('restart').onclick=reset;
}

function reset(){
 objects.forEach(o=>scene.remove(o.mesh));
 objects=[];

 player.position.set(0,0,3);
 player.scale.y=1;

 lane=1;
 coins=0;
 spawnTimer=0;
 speed=15;
 jumping=false;
 ducking=false;
 jumpVelocity=0;

 started=false;
 ended=false;

 timer.textContent='0.00 s';
 status.textContent='Recorde: '+record.toFixed(2)+' s';
 message.innerHTML='TOQUE PARA COMEÇAR!';
 message.style.display='block';
}

function spawn(){
 const laneIndex=Math.floor(Math.random()*3);
 const isCoin=Math.random()<.65;

 const mesh=isCoin?
  new THREE.Mesh(
   new THREE.TorusGeometry(.4,.12,8,20),
   new THREE.MeshStandardMaterial({
    color:0xffd700,
    metalness:.6,
    roughness:.25
   })
  ):
  new THREE.Mesh(
   new THREE.BoxGeometry(1.3,1.2,1),
   new THREE.MeshStandardMaterial({color:0x2255cc})
  );

 mesh.position.set(lanes[laneIndex],isCoin?1:.6,-65);
 scene.add(mesh);

 objects.push({mesh,isCoin});
}

function handleGesture(dx,dy){
 if(!started&&!ended)start();
 if(!started||ended)return;

 if(Math.abs(dx)>Math.abs(dy)){
  if(Math.abs(dx)>30)move(dx>0?1:-1);
 }else{
  if(Math.abs(dy)>30){
   if(dy<0)jump();
   else duck();
  }
 }
}

// Controles por deslize no celular
let touchX=0;
let touchY=0;

renderer.domElement.addEventListener('touchstart',e=>{
 e.preventDefault();
 touchX=e.changedTouches[0].clientX;
 touchY=e.changedTouches[0].clientY;
},{passive:false});

renderer.domElement.addEventListener('touchend',e=>{
 e.preventDefault();

 const dx=e.changedTouches[0].clientX-touchX;
 const dy=e.changedTouches[0].clientY-touchY;

 if(Math.abs(dx)>20||Math.abs(dy)>20){
  handleGesture(dx,dy);
 }else if(!started&&!ended){
  start();
 }
},{passive:false});

// Controles de teclado
window.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')move(-1);
 if(e.key==='ArrowRight')move(1);
 if(e.key==='ArrowUp')jump();
 if(e.key==='ArrowDown')duck();
 if(!started&&!ended)start();
});

// Começar pelo clique no computador
renderer.domElement.addEventListener('click',()=>{
 if(!started&&!ended)start();
});

let previous=performance.now();

function animate(now){
 requestAnimationFrame(animate);

 const dt=Math.min((now-previous)/1000,.05);
 previous=now;

 if(started&&!ended){

  const elapsed=(now-startTime)/1000;
  timer.textContent=elapsed.toFixed(2)+' s';

  status.textContent=
   'Recorde: '+record.toFixed(2)+' s';

  // Movimento do personagem
  player.position.x+=
   (lanes[lane]-player.position.x)*Math.min(1,dt*12);

  // Pulo
  if(jumping){
   player.position.y+=jumpVelocity*dt;
   jumpVelocity-=22*dt;

   if(player.position.y<=0){
    player.position.y=0;
    jumping=false;
    jumpVelocity=0;
   }
  }

  // Agachar
  if(ducking&&now>duckUntil){
   ducking=false;
   player.scale.y=1;
  }

  spawnTimer+=dt;

  if(spawnTimer>1.15){
   spawn();
   spawnTimer=0;
  }

  for(let i=objects.length-1;i>=0;i--){
   const o=objects[i];

   o.mesh.position.z+=speed*dt;

   if(o.isCoin){
    o.mesh.rotation.y+=dt*4;
   }

   const dx=Math.abs(
    o.mesh.position.x-player.position.x
   );
   const dz=Math.abs(
    o.mesh.position.z-player.position.z
   );

   if(dx<.8&&dz<.9){

    if(o.isCoin){
     // Só coleta se estiver no chão!
     if(player.position.y<.65&&!jumping){
      coins++;
      finish('🪙 VOCÊ PEGOU UMA MOEDA!');
     }
    }else{
     // Pulo e agachamento evitam obstáculos
     if(player.position.y<.8&&!ducking){
      finish('🚆 FIM DE JOGO!');
     }
    }
   }

   if(o.mesh.position.z>8){
    scene.remove(o.mesh);
    objects.splice(i,1);
   }
  }
 }

 renderer.render(scene,camera);
}

requestAnimationFrame(animate);

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
